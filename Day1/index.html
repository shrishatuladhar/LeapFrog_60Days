<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            background: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        img {
            width: 150px;
            border-radius: 50%;
            margin-right: 20px;
            border: 4px solid #ddd;
        }
        .text-container {
            flex: 1;
        }
        p {
            font-weight: 700;
            font-size: 24px;
            color: #333;
            margin-top: 0;
        }
        .author {
            font-size: 18px;
            font-weight: 400;
            color: #666;
            margin-top: 10px;
            margin-left: 170px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/user.jpg" alt="User Image">
        <div class="text-container">
            <p>Hi, this is Day 1 of me learning with Leapfrog.</p>
            <p class="author">- Shrisha Tuladhar</p>
        </div>
    </div>
</body>
</html>
